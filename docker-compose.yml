services:
  ollama-service:
    build:
      context: .
      dockerfile: Ollama.Dockerfile
      args:
        OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5B}
    image: custom-ollama-baked:latest
    container_name: ollama-service
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ocr_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-db:
    image: mysql:8.0
    container_name: ocr_mysql
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-ocrdb}
      - MYSQL_USER=${MYSQL_USER:-ocruser}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-ocrpass}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uocruser", "-pocrpass"]
      interval: 10s
      timeout: 5s
      retries: 5

  ocr-pipeline-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ocr-pipeline:latest
    container_name: ocr-pipeline-api
    depends_on:
      redis:
        condition: service_healthy
      ollama-service:
        condition: service_started
      mysql-db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./ocr_pipeline:/app/ocr_pipeline:ro
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:1.5B}
      - OLLAMA_URL=http://ollama-service:11434
      - MYSQL_HOST=${MYSQL_HOST:-mysql-db}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-ocrdb}
      - MYSQL_USER=${MYSQL_USER:-ocruser}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-ocrpass}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import requests; requests.get('http://localhost:8000/docs', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 4G

  ocr-worker:
    image: ocr-pipeline:latest
    container_name: ocr-worker
    depends_on:
      redis:
        condition: service_healthy
      mysql-db:
        condition: service_healthy
    command: celery -A ocr_pipeline.core.celery_app worker -Q ocr --loglevel=info --concurrency=2 --max-tasks-per-child=1
    volumes:
      - ./ocr_pipeline:/app/ocr_pipeline:ro
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_URL=http://ollama-service:11434
      - MYSQL_HOST=${MYSQL_HOST:-mysql-db}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-ocrdb}
      - MYSQL_USER=${MYSQL_USER:-ocruser}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-ocrpass}
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 8G
    restart: unless-stopped

  llm-worker:
    image: ocr-pipeline:latest
    container_name: llm-worker
    depends_on:
      redis:
        condition: service_healthy
      ollama-service:
        condition: service_started
      mysql-db:
        condition: service_healthy
    command: celery -A ocr_pipeline.core.celery_app worker -Q llm --loglevel=info --concurrency=4
    volumes:
      - ./ocr_pipeline:/app/ocr_pipeline:ro
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_URL=http://ollama-service:11434
      - MYSQL_HOST=${MYSQL_HOST:-mysql-db}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-ocrdb}
      - MYSQL_USER=${MYSQL_USER:-ocruser}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-ocrpass}
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
    restart: unless-stopped

volumes:
  mysql_data:
