services:
  ollama-service:
    build:
      context: .
      dockerfile: Ollama.Dockerfile
      args:
        # Allows you to dynamically change what model gets baked (e.g. OLLAMA_MODEL=qwen2.5:0.5b docker compose up)
        OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:0.8B}
    image: custom-ollama-baked:latest
    container_name: ollama-service
    ports:
      - "11434:11434"
    restart: unless-stopped
    # GPU reservation removed for CPU-only compatibility
    # To re-enable, add the 'deploy' section with 'driver: nvidia'

    # NOTE: Since the model is completely baked in via Ollama.Dockerfile, we don't need a volume here!
  ocr-pipeline-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ocr-pipeline:latest
    container_name: ocr-pipeline-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for hot-reload during development
      - ./ocr_pipeline:/app/ocr_pipeline:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./tests:/app/tests:ro
    environment:
      # Logging configuration
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.5:0.8B}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import requests; requests.get('http://localhost:8000/docs', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 8G
        reservations:
          cpus: "1"
          memory: 4G
